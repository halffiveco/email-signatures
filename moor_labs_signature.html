<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Moor Labs Signature</title>
	</head>
	<body>
		<table
			style="
				font-family: Arial, Helvetica, sans-serif;
				font-size: 14px;
				border-collapse: collapse;
				background-color: #1c284a;
			"
			cellpadding="0"
			cellspacing="0"
		>
			<tr>
				<td style="padding: 18px 0 18px 18px; vertical-align: top">
					<img
						src="https://raw.githubusercontent.com/fwmoor/fwmoor/main/icons/fred.jpg"
						alt="Fred Moor"
						width="88"
						height="88"
						style="display: block; object-fit: cover"
					/>
				</td>
				<td
					style="
						border-left: 2px solid #ca8968;
						padding: 18px 20px;
						vertical-align: top;
					"
				>
					<p
						style="
							margin: 0;
							font-family: Georgia, 'Times New Roman', serif;
							font-size: 18px;
							font-weight: bold;
							color: #f2f5f8;
						"
					>
						Fred Moor
					</p>
					<p style="margin: 2px 0 0; font-size: 13px; color: #ca8968; font-weight: bold">
						Head of Experiments, Moor Labs
					</p>

					<div
						style="
							height: 1px;
							background-color: #ca8968;
							margin: 8px 0 4px;
						"
					></div>

					<!-- Contact list -->
					<table
						style="
							font-size: 13px;
							color: #94a0b8;
							border-collapse: collapse;
							margin-top: 8px;
						"
					>
						<tr>
							<td style="width: 16px; vertical-align: middle">
								<img
									src="https://raw.githubusercontent.com/fwmoor/fwmoor/main/icons/email.png"
									alt="email"
									width="13"
									height="13"
									style="display: block"
								/>
							</td>
							<td style="padding-left: 6px; vertical-align: middle">
								<a
									href="mailto:fred@moorlabs.co.za"
									style="color: #f2f5f8; text-decoration: none"
								>
									fred@moorlabs.co.za
								</a>
							</td>
						</tr>
						<tr>
							<td style="width: 16px; vertical-align: middle">
								<img
									src="https://raw.githubusercontent.com/fwmoor/fwmoor/main/icons/web.png"
									alt="web"
									width="13"
									height="13"
									style="display: block"
								/>
							</td>
							<td style="padding-left: 6px; vertical-align: middle">
								<a
									href="https://moorlabs.com"
									style="color: #94a0b8; text-decoration: none"
								>
									www.moorlabs.co.za
								</a>
							</td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td colspan="2">
					<a
						href="https://calendly.com/halffive"
						style="
							background-color: #ca8968;
							color: #ffffff;
							font-weight: bold;
							text-decoration: none;
							padding: 8px 0;
							display: inline-block;
							cursor: pointer;
							text-align: center;
							text-transform: uppercase;
							width: 100%;
							font-size: 12px;
						"
					>
						Book a free consultation ➔
					</a>
				</td>
			</tr>
		</table>
	</body>
</html>
