<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Moor Labs Signature</title>
	</head>
	<body>
		<table role="presentation" width="320" cellpadding="0" cellspacing="0" border="0" bgcolor="#0e1322" style="width: 320px; border-collapse: separate; background-color: #0e1322; border-radius: 16px">
			<tr>
				<td style="padding: 22px 24px 20px">
					<!-- Photo + name -->
					<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
						<tr>
							<td valign="middle" style="padding-right: 16px; vertical-align: middle">
								<img src="https://fwmoor.github.io/signature/fred-moor.jpg" alt="Fred Moor" width="64" height="64" style="display: block; width: 64px; height: 64px; border: 0; border-radius: 32px" />
							</td>
							<td valign="middle" style="vertical-align: middle">
								<p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 26px; letter-spacing: -0.2px; color: #f2eee7">Fred Moor</p>
								<p style="margin: 2px 0 0; font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; color: #a2a8b6">Head of Experiments</p>
							</td>
						</tr>
					</table>

					<!-- Hairline -->
					<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
						<tr><td height="18" style="height: 18px; font-size: 0; line-height: 0; border-bottom: 1px solid #292d3a">&nbsp;</td></tr>
						<tr><td height="16" style="height: 16px; font-size: 0; line-height: 0">&nbsp;</td></tr>
					</table>

					<!-- Wordmark + call to action -->
					<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
						<tr>
							<td valign="middle" style="vertical-align: middle">
								<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
									<tr>
										<td valign="middle" style="padding-right: 7px; vertical-align: middle">
											<img src="https://fwmoor.github.io/signature/half-five-mark.png" alt="" width="17" height="17" style="display: block; width: 17px; height: 17px; border: 0" />
										</td>
										<td valign="middle" style="vertical-align: middle; font-family: Georgia, 'Times New Roman', serif; font-size: 17px; line-height: 20px; letter-spacing: -0.2px; color: #f2eee7">Moor Labs</td>
									</tr>
								</table>
							</td>
							<td align="right" valign="middle" style="vertical-align: middle">
								<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: separate">
									<tr>
										<td bgcolor="#e17a47" style="padding: 7px 15px; background-color: #e17a47; border-radius: 999px; font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 16px; font-weight: bold">
											<a href="https://calendly.com/halffive" style="color: #0e1322; text-decoration: none">Book a call&nbsp;&rarr;</a>
										</td>
									</tr>
								</table>
							</td>
						</tr>
					</table>

					<!-- Contact -->
					<p style="margin: 14px 0 0; font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px; color: #a2a8b6">
						<a href="mailto:fred@moorlabs.co.za" style="color: #f2eee7; text-decoration: none">fred@moorlabs.co.za</a><span style="color: #e17a47">&nbsp;&nbsp;&middot;&nbsp;&nbsp;</span><a href="https://moorlabs.co.za" style="color: #f2eee7; text-decoration: none">moorlabs.co.za</a>
					</p>
				</td>
			</tr>
		</table>
	</body>
</html>
