<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Half Five Signature</title>
	</head>
	<body>
		<table
			style="
				font-family: Arial, Helvetica, sans-serif;
				font-size: 14px;
				border-collapse: collapse;
				background-color: #1c284a;
				border-radius: 12px;
				overflow: hidden;
				width: 100%;
			"
			cellpadding="0"
			cellspacing="0"
		>
			<tr>
				<td style="padding: 20px 0 20px 20px; vertical-align: top; width: 116px">
					<img
						src="https://raw.githubusercontent.com/fwmoor/fwmoor/main/icons/fred.jpg"
						alt="Fred Moor"
						width="96"
						height="96"
						style="display: block; border-radius: 8px; object-fit: cover"
					/>
				</td>
				<td style="padding: 20px 22px 20px 20px; vertical-align: top">
					<p
						style="
							margin: 0;
							font-family: Georgia, 'Times New Roman', serif;
							font-size: 19px;
							font-weight: bold;
							color: #f2f5f8;
						"
					>
						Fred Moor
					</p>
					<p
						style="
							margin: 2px 0 0;
							font-size: 13px;
							font-weight: bold;
							color: #ca8968;
							letter-spacing: 0.2px;
						"
					>
						Head of Experiments
					</p>

					<div
						style="
							height: 1px;
							background-color: #ca8968;
							opacity: 0.5;
							margin: 10px 0;
							width: 100%;
							max-width: 220px;
						"
					></div>

					<!-- Logo mark + contact list -->
					<table style="border-collapse: collapse">
						<tr>
							<td style="width: 22px; vertical-align: middle">
								<img
									src="https://raw.githubusercontent.com/halffiveco/email-signatures/main/assets/half-five-icon.svg"
									alt="Half Five"
									width="18"
									height="18"
									style="display: block"
								/>
							</td>
							<td style="padding-left: 8px; vertical-align: middle">
								<table
									style="
										font-size: 13px;
										color: #94a0b8;
										border-collapse: collapse;
									"
								>
									<tr>
										<td style="padding-bottom: 2px">
											<a
												href="mailto:fred@halffive.co"
												style="color: #f2f5f8; text-decoration: none"
											>
												fred@halffive.co
											</a>
										</td>
									</tr>
									<tr>
										<td>
											<a
												href="https://halffive.co"
												style="color: #94a0b8; text-decoration: none"
											>
												halffive.co
											</a>
										</td>
									</tr>
								</table>
							</td>
						</tr>
					</table>

					<a
						href="https://calendly.com/halffive"
						style="
							display: inline-block;
							margin-top: 14px;
							padding: 8px 18px;
							background-color: #ca8968;
							color: #ffffff;
							font-size: 13px;
							font-weight: bold;
							text-decoration: none;
							border-radius: 999px;
							cursor: pointer;
						"
					>
						Book a call →
					</a>
				</td>
			</tr>
		</table>
	</body>
</html>
