<!DOCTYPE html>
<html lang="en">
	<head>

					<p style="margin: 10px 0 0; font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 20px; color: #555d70">
						<a href="mailto:fred@halffive.co" style="color: #141b2d; text-decoration: none">fred@halffive.co</a><br />
						<a href="https://halffive.co" style="color: #141b2d; text-decoration: none">halffive.co</a>
					</p>

					<!-- Button, styled like the one on halffive.co -->
					<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
						<tr>
							<td style="padding-top: 12px">
								<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: separate">
									<tr>
										<td bgcolor="#e17a47" style="padding: 4px 4px 4px 16px; background-color: #e17a47; border-radius: 999px">
											<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse">
												<tr>
													<td valign="middle" style="vertical-align: middle; font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 16px; font-weight: bold">
														<a href="https://calendly.com/halffive" style="color: #0e1322; text-decoration: none">Book a free call</a>
													</td>
													<td valign="middle" style="padding-left: 10px; vertical-align: middle">
														<a href="https://calendly.com/halffive" style="text-decoration: none"><img src="https://fwmoor.github.io/signature/cta-chip.png" alt="" width="22" height="22" style="display: block; width: 22px; height: 22px; border: 0" /></a>
													</td>
												</tr>
											</table>
										</td>
									</tr>
								</table>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
