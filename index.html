<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<table
			style="
				font-family: Arial, sans-serif;
				font-size: 14px;
				color: #333;
				border-collapse: collapse;
			"
		>
			<tr>
				<td style="padding-right: 12px; vertical-align: top">
					<img
						src="YOUR_IMAGE_URL"
						alt="Fred Moor"
						width="64"
						height="64"
						style="border-radius: 50%; object-fit: cover"
					/>
				</td>
				<td
					style="
						border-left: 2px solid #808b58;
						padding-left: 12px;
						vertical-align: top;
					"
				>
					<p
						style="
							margin: 0;
							font-size: 16px;
							font-weight: bold;
							color: #000;
						"
					>
						Fred Moor
					</p>
					<p style="margin: 0; color: #808b58; font-weight: 500">
						Head of Experiments
					</p>

					<div
						style="
							height: 1px;
							background-color: #808b58;
							margin: 8px 0;
						"
					></div>

					<!-- Contact list -->
					<table
						style="
							font-size: 13px;
							color: #555;
							border-collapse: collapse;
						"
					>
						<tr>
							<td style="width: 16px; vertical-align: middle">
								<img
									src="https://raw.githubusercontent.com/fwmoor/fwmoor/main/icons/calendar.png"
									alt="calendar"
									width="13"
									height="13"
									style="display: block"
								/>
							</td>
							<td
								style="
									padding-left: 6px;
									vertical-align: middle;
								"
							>
								<a
									href="https://calendly.com/moorlabs"
									style="
										color: #808b58;
										font-weight: 500;
										text-decoration: none;
										cursor: pointer;
									"
								>
									Book a free consultation
								</a>
							</td>
						</tr>
						<tr>
							<td style="width: 16px; vertical-align: middle">
								<img
									src="https://raw.githubusercontent.com/fwmoor/fwmoor/main/icons/email.png"
									alt="email"
									width="13"
									height="13"
									style="display: block"
								/>
							</td>
							<td
								style="
									padding-left: 6px;
									vertical-align: middle;
								"
							>
								<a
									href="mailto:fred@moorlabs.co.za"
									style="
										color: #555;
										text-decoration: none;
										cursor: pointer;
									"
								>
									fred@moorlabs.co.za
								</a>
							</td>
						</tr>
						<tr>
							<td style="width: 16px; vertical-align: middle">
								<img
									src="https://raw.githubusercontent.com/fwmoor/fwmoor/main/icons/web.png"
									alt="web"
									width="13"
									height="13"
									style="display: block"
								/>
							</td>
							<td
								style="
									padding-left: 6px;
									vertical-align: middle;
								"
							>
								<a
									href="https://moorlabs.com"
									style="
										color: #555;
										text-decoration: none;
										cursor: pointer;
									"
								>
									www.moorlabs.co.za
								</a>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
